name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  firmware:
    name: Firmware build (${{ matrix.env }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # both boards and their hardware checks (platformio.ini)
        env: [cyd, hwcheck, s3, hwcheck_s3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio==6.2.0
      - name: Stub config (the real src/config.h is git-ignored)
        run: cp include/config.example.h src/config.h
      - name: Build
        run: pio run -e ${{ matrix.env }}

  host-tests:
    name: Host unit tests (Unity + g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-native-${{ hashFiles('platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO and Unity
        run: |
          pip install platformio==6.2.0
          pio pkg install -e native -l throwtheswitch/Unity
      - name: Run all suites
        shell: pwsh
        run: ./tools/run_tests.ps1
