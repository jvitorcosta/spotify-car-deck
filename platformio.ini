[platformio]
default_envs = cyd

[env]
monitor_speed = 115200

; Shared by both boards; each [env] pulls these in with ${common.*}.
[common]
platform = espressif32@6.9.0
framework = arduino
monitor_filters = esp32_exception_decoder
; Unifont CJK glyphs (tools/gen_cjk_font.py) stay in flash, read on demand
board_build.embed_files =
    data/cjk16.bin
    data/greeting.pcm
    data/montage.bin
    data/finale.pcm
    data/opener.pcm
; SpotifyArduino hard-codes SPOTIFY_DEBUG, which prints the refresh token and client secret
extra_scripts =
    pre:tools/patch_spotify_lib.py
    ; boot greeting: data/greeting.pcm is your clip (git-ignored), else the default chime
    pre:tools/greeting_clip.py
    ; boot scene photo montage: data/montage.bin from tools/gen_montage.py (git-ignored), else empty
    pre:tools/montage_clip.py
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.4.3
    bodmer/TJpg_Decoder@1.1.0
    bitbank2/PNGdec@1.1.6
    https://github.com/witnessmenow/spotify-api-arduino.git#6261278
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=3
    ; ---- TFT_eSPI: both boards have an ILI9341 on SPI; pins per board below ----
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_RST=-1
    -D TFT_BACKLIGHT_ON=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D SPI_READ_FREQUENCY=20000000
    -D USE_HSPI_PORT=1
build_unflags = -std=gnu++11
; Warnings for our code only (src/), not the core or third-party libraries.
build_src_flags = -Wall -Wextra

; ESP32-2432S028R "Cheap Yellow Display" (the first deck).
[env:cyd]
platform = ${common.platform}
framework = ${common.framework}
board = esp32dev
monitor_filters = ${common.monitor_filters}
board_build.partitions = huge_app.csv
board_build.embed_files = ${common.board_build.embed_files}
extra_scripts = ${common.extra_scripts}
lib_deps = ${common.lib_deps}
build_flags =
    ${common.build_flags}
    -D BOARD_CYD=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_BL=21
    -D SPI_FREQUENCY=55000000
    ; TFT on HSPI (GPIO 12-15 are its native pins); VSPI stays free for the SD card.
    ; Sharing VSPI routed SD reads to the TFT MISO pin (fixed in commit 2b75c40).
build_unflags = ${common.build_unflags}
build_src_flags = ${common.build_src_flags}
build_src_filter = +<*> -<board/s3/> -<hwcheck.cpp> -<hwcheck_s3.cpp>

; Standalone hardware-check target for the CYD (display/colors/orientation/touch). Not the firmware.
;   pio run -e hwcheck -t upload
[env:hwcheck]
extends = env:cyd
; the touch controller is only exercised here (the firmware has no touch input)
lib_deps =
    ${common.lib_deps}
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d
build_src_filter = -<*> +<hwcheck.cpp>

[env:native]
platform = native
test_framework = unity
; Host tests live in test/ and #include the pure modules from src/ directly. This env
; mainly fetches Unity into .pio/libdeps/native; tools/run_tests.ps1 compiles each suite with
; g++ (pio test -e native does not work for this layout).
build_flags = -std=gnu++17 -D UNIT_TEST
