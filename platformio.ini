[platformio]
default_envs = esp32dev

[env]
monitor_speed = 115200

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv
; Unifont CJK glyphs (tools/gen_cjk_font.py) stay in flash, read on demand
board_build.embed_files = data/cjk16.bin
; exclude the standalone hardware-check sketch from the firmware build
build_src_filter = +<*> -<hwcheck.cpp>
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d
    bblanchon/ArduinoJson@7.4.3
    bodmer/TJpg_Decoder@1.1.0
    bitbank2/PNGdec@1.1.6
    https://github.com/witnessmenow/spotify-api-arduino.git#6261278
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=3
    ; ---- TFT_eSPI config for CYD (ESP32-2432S028R) ----
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; TFT on HSPI (GPIO 12-15 are its native pins); VSPI stays free for the SD card.
    ; Sharing VSPI routed SD reads to the TFT MISO pin (final review, Important #1).
    -D USE_HSPI_PORT=1
build_unflags = -std=gnu++11

; Standalone hardware-check target (display/colors/orientation/touch). Not the firmware.
;   .devtools\pio.ps1 run -e hwcheck -t upload
[env:hwcheck]
extends = env:esp32dev
build_src_filter = -<*> +<hwcheck.cpp>

[env:native]
platform = native
test_framework = unity
; Pure-logic modules live in lib/ so tests #include them and PlatformIO compiles
; only those libraries here — Arduino-dependent src/ is never built under native.
build_flags = -std=gnu++17 -D UNIT_TEST
